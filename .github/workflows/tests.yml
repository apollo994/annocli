name: Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with test deps
        run: pip install -e ".[dev]"

      - name: Unit and component tests
        run: pytest tests/unit tests/component -v --tb=short

      - name: End-to-end tests (live Annotrieve API)
        run: pytest -m e2e -o addopts= -v --tb=short
